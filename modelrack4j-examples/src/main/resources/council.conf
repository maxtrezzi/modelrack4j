# The three-model scenario: two Anthropic models at different temperatures for a
# short/long answer pair, and an OpenAI model that also moderates.
#
# Model names are plain strings: the schema does not validate them and LangChain4j's
# model-name enums are a convenience, not a whitelist. That matters here because an enum is
# compiled at release time and therefore lags the providers — `gpt-5.1` is in
# OpenAiChatModelName at 1.19.0, `claude-sonnet-5` is not in AnthropicChatModelName yet, and
# both work. Check them against your own account's access.
#
# Keys use MANDATORY substitution: ${VAR} fails loudly at load time when unset. Do not
# switch these to ${?VAR} — the optional form silently yields no value, and the failure
# then surfaces as an auth error at the first request instead.
llm {
  SL {
    provider    = anthropic
    api-key     = ${ANTHROPIC_API_KEY}
    model-name  = "claude-sonnet-5"
    temperature = 0.2
    timeout     = 60s
    memory { type = message-window, max-messages = 20 }
  }

  SH {
    provider    = anthropic
    api-key     = ${ANTHROPIC_API_KEY}
    model-name  = "claude-sonnet-5"
    temperature = 0.9
    streaming   = true
  }

  CR {
    provider    = openai
    api-key     = ${OPENAI_API_KEY}
    model-name  = "gpt-5.1"
    temperature = 0.7
    moderation { enabled = true }
  }
}
