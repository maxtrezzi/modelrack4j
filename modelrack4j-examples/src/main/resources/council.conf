# The three-model scenario: two Anthropic models at different temperatures for a
# short/long answer pair, and an OpenAI model that also moderates.
#
# Model names are taken from LangChain4j 1.19.0's own model-name enums, so they are valid
# for the pinned version rather than from memory. Check them against your account's access.
#
# Keys use MANDATORY substitution: ${VAR} fails loudly at load time when unset. Do not
# switch these to ${?VAR} — the optional form silently yields no value, and the failure
# then surfaces as an auth error at the first request instead.
llm {
  SL {
    provider    = anthropic
    api-key     = ${ANTHROPIC_API_KEY}
    model-name  = "claude-sonnet-4-6"
    temperature = 0.2
    timeout     = 60s
    memory { type = message-window, max-messages = 20 }
  }

  SH {
    provider    = anthropic
    api-key     = ${ANTHROPIC_API_KEY}
    model-name  = "claude-sonnet-4-6"
    temperature = 0.9
    streaming   = true
  }

  CR {
    provider    = openai
    api-key     = ${OPENAI_API_KEY}
    model-name  = "gpt-5-mini"
    temperature = 0.7
    moderation { enabled = true }
  }
}
