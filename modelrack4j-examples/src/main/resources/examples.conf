# The configuration both file-driven examples read: ThreeModelCouncil and ConsoleChat. SL and
# SH are two configuration names on the same Anthropic model, differing only in memory and
# streaming; CR is an OpenAI model that also moderates. ProviderSwap and AtomicSnapshot write
# their own configuration at run time and do not read this file.
#
# Model names are plain strings: the schema does not validate them and LangChain4j's
# model-name enums are a convenience, not a whitelist. That matters here because an enum is
# compiled at release time and therefore lags the providers — `gpt-5.1` is in
# OpenAiChatModelName at 1.19.0, `claude-sonnet-5` is not in AnthropicChatModelName yet, and
# both work. Check them against your own account's access.
#
# No `temperature` on the Anthropic blocks: claude-sonnet-5's adaptive thinking controls its
# own sampling, and the API rejects a non-default temperature/top_p/top_k with a 400 — found
# by running this file live, not read from documentation. `gpt-5.1` below still accepts it.
#
# Keys use MANDATORY substitution: ${VAR} fails loudly at load time when unset. Do not
# switch these to ${?VAR} — the optional form silently yields no value, and the failure
# then surfaces as an auth error at the first request instead.
llm {
  SL {
    description = "short, cheap — the everyday answer, twenty turns of memory"
    provider    = anthropic
    api-key     = ${ANTHROPIC_API_KEY}
    model-name  = "claude-sonnet-5"
    timeout     = 60s
    memory { type = message-window, max-messages = 20 }
  }

  SH {
    description = "the same model, streamed for long answers"
    provider    = anthropic
    api-key     = ${ANTHROPIC_API_KEY}
    model-name  = "claude-sonnet-5"
    streaming   = true
  }

  CR {
    description = "the critic, and the only one that moderates"
    provider    = openai
    api-key     = ${OPENAI_API_KEY}
    model-name  = "gpt-5.1"
    temperature = 0.7
    moderation { enabled = true }
  }
}
