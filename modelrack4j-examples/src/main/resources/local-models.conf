# Models on your own machine, for ConsoleChat and ThreeModelCouncil, with no API key and no
# cost:
#
#   ./run-chat.sh modelrack4j-examples/src/main/resources/local-models.conf
#   ./run-council.sh modelrack4j-examples/src/main/resources/local-models.conf
#
# Both blocks reach the same Ollama server, in the two ways this library offers:
#
#   OLLAMA      provider = ollama, Ollama's own protocol. No key is allowed, and the address
#               is required.
#   OPENAI-API  provider = openai with a base-url. This is the way to reach any server that
#               speaks the OpenAI protocol: LocalAI, llama.cpp's server, vLLM, LM Studio, and
#               Ollama too, whose OpenAI-compatible address ends in /v1. No key is needed.
#
# Start the server and pull the model first:  ollama pull llama3.2
# To use a model you already have, set OLLAMA_MODEL, for example OLLAMA_MODEL=tinyllama.
# For another server, change the two base-url values.
#
# A local model can answer much more slowly than a hosted one, especially the first time it is
# loaded, so the timeout is longer than the default 60s.
llm {
  OLLAMA {
    description = "Ollama, through its own provider"
    provider    = ollama
    base-url    = "http://localhost:11434"
    model-name  = "llama3.2"
    model-name  = ${?OLLAMA_MODEL}
    timeout     = 120s
    streaming   = true
    memory { type = message-window, max-messages = 20 }
  }

  OPENAI-API {
    description = "the same server, through the OpenAI protocol"
    provider    = openai
    base-url    = "http://localhost:11434/v1"
    model-name  = "llama3.2"
    model-name  = ${?OLLAMA_MODEL}
    timeout     = 120s
    memory { type = message-window, max-messages = 20 }
  }
}
