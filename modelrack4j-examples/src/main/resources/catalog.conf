# One block for every row of docs/manual/providers.md: each provider module, and each service
# reached through provider = openai or provider = anthropic with a base-url.
#
# This file is a catalogue to copy from, not a configuration to load as it is. Every key uses
# mandatory substitution, so loading the whole file needs every variable below to be set.
# Copy the block you need into your own file instead.
#
# How sure each block is — module, tested by hand, or only declared by the vendor — is on that
# page, with the date each value was read. Model names change often: check yours against the
# vendor's own list.
#
# CatalogTest, in this module, loads this file and every hocon block of providers.md with
# placeholder keys, and checks that each block validates. It sends no request.
llm {
  # Provider modules.
  OPENAI    { provider = openai,    api-key = ${OPENAI_API_KEY},    model-name = "gpt-5-mini" }
  ANTHROPIC { provider = anthropic, api-key = ${ANTHROPIC_API_KEY}, model-name = "claude-sonnet-4-6" }
  GEMINI    { provider = gemini,    api-key = ${GEMINI_API_KEY},    model-name = "gemini-3.6-flash" }
  GLM       { provider = glm,       api-key = ${ZHIPU_API_KEY},     model-name = "glm-5.3" }
  MISTRAL   { provider = mistral,   api-key = ${MISTRAL_API_KEY},   model-name = "mistral-small-latest" }
  OLLAMA    { provider = ollama, base-url = "http://localhost:11434", model-name = "llama3.2" }

  # Servers on your own machine, through the OpenAI protocol. LOCAL-SERVER's address is an
  # example: use the one your server prints when it starts.
  OLLAMA-OPENAI { provider = openai, base-url = "http://localhost:11434/v1", model-name = "llama3.2" }
  LOCAL-SERVER  { provider = openai, base-url = "http://localhost:8080/v1",  model-name = "your-model" }

  # Hosted services that speak the OpenAI protocol, or the Anthropic one.
  KIMI {
    provider   = openai
    base-url   = "https://api.moonshot.ai/v1"
    api-key    = ${MOONSHOT_API_KEY}
    model-name = "kimi-k3.1-pro"
  }
  KIMI-ANTHROPIC {
    provider   = anthropic
    base-url   = "https://api.moonshot.ai/anthropic/v1"
    api-key    = ${MOONSHOT_API_KEY}
    model-name = "kimi-k3.1-pro"
  }
  DEEPSEEK {
    provider   = openai
    base-url   = "https://api.deepseek.com"
    api-key    = ${DEEPSEEK_API_KEY}
    model-name = "deepseek-flash"
  }
  GROQ {
    provider   = openai
    base-url   = "https://api.groq.com/openai/v1"
    api-key    = ${GROQ_API_KEY}
    model-name = "llama-3.3-70b-versatile"
  }
  OPENROUTER {
    provider   = openai
    base-url   = "https://openrouter.ai/api/v1"
    api-key    = ${OPENROUTER_API_KEY}
    model-name = "~openai/gpt-sol-latest"
  }
  TOGETHER {
    provider   = openai
    base-url   = "https://api.together.ai/v1"
    api-key    = ${TOGETHER_API_KEY}
    model-name = "MiniMaxAI/MiniMax-M3"
  }
  XAI {
    provider   = openai
    base-url   = "https://api.x.ai/v1"
    api-key    = ${XAI_API_KEY}
    model-name = "grok-4.7"
  }
}
