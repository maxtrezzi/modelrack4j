name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ADR-0026 gives each leg its own job, so that a later reader can tell whether a
        # leg still earns its place:
        #   17 — the claimed floor. Nothing else proves the floor holds.
        #   21 — the most widely deployed LTS among likely consumers.
        #   25 — the development JDK, and the current LTS.
        # The 25 leg tracks the development machine rather than the number. If moving it
        # ever collides with the 21 leg, drop to two legs (ADR-0026) instead of keeping a
        # leg whose job another one already covers.
        jdk: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven

      # verify, not package: the enforcer's convergence rule, the license-header check and
      # the Javadoc build all have to be part of what "green" means (M0).
      - name: Build
        run: mvn -B --no-transfer-progress clean verify

  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    steps:
      # Needs the full checkout: the checker resolves every link against `git ls-files`
      # rather than the filesystem, because a target that is git-ignored resolves fine on a
      # contributor's machine and 404s for everyone who clones. That exact false pass is
      # what this job exists to stop.
      - uses: actions/checkout@v4

      - name: Check ADR status lines, the index, and every link
        run: python3 build/check-docs.py

  offline:
    name: offline, no API keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Everything except the -Pintegration profile must pass with no provider keys in the
      # environment. This job exists so that a test which quietly depends on one fails here
      # rather than in a contributor's fork.
      - name: Build with no provider credentials
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          GEMINI_API_KEY: ''
          ZHIPU_API_KEY: ''
        run: mvn -B --no-transfer-progress clean verify
