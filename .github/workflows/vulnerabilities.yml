name: vulnerabilities

# Known vulnerabilities in the dependencies, from the OSV database (ADR-0064). A separate
# workflow from build.yml because the weekly run has nothing to build: it asks whether a
# dependency that was clean last week has an advisory now, on dev and on main.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned, and checked against the checksum the release publishes, because this binary
  # decides whether a pull request may merge. Move both lines together.
  OSV_SCANNER_VERSION: v2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  # What writes the SBOM osv-scanner reads, so that Maven resolves the graph (see the script).
  CYCLONEDX_VERSION: 2.9.3

jobs:
  scan:
    # A required check: keep this name stable, the branch rules refer to it.
    name: known vulnerabilities
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Look up every shipped dependency, as Maven resolves it
        run: build/osv-scan.sh

  # Two jobs rather than a matrix, so that their names read correctly on a pull request too,
  # where GitHub lists them as skipped without expanding a matrix. main is what Maven Central
  # holds (ADR-0061), so a red run there is an advisory against a released version.
  #
  # Each takes the script from the branch this workflow runs on and checks out the tree it
  # scans beside it: main carries a release's files only, so it may not have the script.
  weekly-dev:
    name: known vulnerabilities, weekly, dev
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: dev
          path: scanned
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Look up every shipped dependency, as Maven resolves it
        run: build/osv-scan.sh scanned

  weekly-main:
    name: known vulnerabilities, weekly, main
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: main
          path: scanned
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Look up every shipped dependency, as Maven resolves it
        run: build/osv-scan.sh scanned
