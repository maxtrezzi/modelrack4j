# modelrack4j defaults.
#
# These are the documented v1 defaults, applied beneath every user layer. They are kept in
# one place so the answer to "what happens if I omit this key?" is readable rather than
# implied by an example.
#
# Note this is NOT named reference.conf: HOCON merges reference.conf automatically only for
# fixed paths, and configuration names here are user-chosen (SL, SH, CR...), so the defaults
# below are merged into each named block explicitly by the loader.
modelrack4j {
  defaults {
    # No streaming model unless asked for.
    streaming = false

    # Request and response logging is off: both can put prompts, and therefore user data,
    # into application logs.
    log-requests = false
    log-responses = false

    timeout = 60s

    # Deliberately absent, because absence is meaningful:
    #   description  — omitted means the file says nothing about what this block is for
    #   temperature  — omitted means "accept the provider's own default"
    #   memory       — omitted means no ChatMemoryProvider is built
    #   moderation   — omitted means no ModerationModel is built
  }
}
